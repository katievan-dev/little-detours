<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf7ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24262b" media="(prefers-color-scheme: dark)">
<title>Little Passport</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fbf7ee; --paper2:#f3ecdc; --ink:#3d372f; --muted:#8a8072; --line:#d9cfbc;
  --accent:#e2574c; --accent2:#3e5f93; --yellow:#f2c14e; --mint:#5aa889; --sky:#8fc1e3;
  --card-face:#fffcf4; --right:#dcefd9; --wrong:#f8dcd6; --veil:rgba(251,247,238,.78); --shadow:rgba(80,60,30,.14);
  --hand:'Patrick Hand','Comic Sans MS',cursive; --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; --tc:'LXGW WenKai TC','Klee One','PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif; --jp:'Klee One','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --wobble:255px 14px 225px 16px/16px 225px 14px 255px; --wobble2:14px 230px 16px 250px/240px 16px 230px 14px;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
body[data-theme="jp"]{--paper:#fcf6f0;--paper2:#f5e9e2;--accent:#e2574c;--accent2:#3e5f93}
body[data-theme="vn"]{--paper:#fbf6e4;--paper2:#f2ead0;--accent:#d4553f;--accent2:#2f8a6a}
body[data-theme="tw"]{--paper:#fbf5ef;--paper2:#f1e7dc;--accent:#d9473f;--accent2:#3e88b8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#24262b; --paper2:#2e3036; --ink:#efe8da; --muted:#a8a091; --line:#47484f; --card-face:#fbf6ea;
  --right:#2f4a35; --wrong:#55332f; --veil:rgba(30,31,36,.82); --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
:root:not([data-theme="light"]) body[data-theme]{--paper:#24262b;--paper2:#2e3036}}
:root[data-theme="dark"]{--paper:#24262b;--paper2:#2e3036;--ink:#efe8da;--muted:#a8a091;--line:#47484f;--card-face:#fbf6ea;--right:#2f4a35;--wrong:#55332f;--veil:rgba(30,31,36,.82);--shadow:rgba(0,0,0,.45);color-scheme:dark}
:root[data-theme="dark"] body[data-theme]{--paper:#24262b;--paper2:#2e3036}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);overscroll-behavior:none;transition:background-color .4s}
body{height:100%;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .45 0 0 0 0 .38 0 0 0 0 .28 0 0 0 .09 0'/%3E%3C/filter%3E%3Crect width='200' height='200' filter='url(%23n)'/%3E%3C/svg%3E");font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
:lang(ja){font-family:var(--jp)}
:lang(zh-Hant){font-family:var(--tc)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2.5px dashed var(--accent);outline-offset:3px}
[hidden]{display:none!important}
img.art{display:block;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}
#backdrop img.bd{width:100%;height:100%;object-fit:cover;opacity:.38}
.card .inner{will-change:transform}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.sk *{fill:none!important}
.ol{fill:none;stroke-width:1.5}.ol *{fill:none!important;stroke:inherit!important}
.art.flat .sk{display:none}

.app{height:100%;max-width:480px;margin:0 auto;position:relative;display:flex;flex-direction:column;z-index:2}
#backdrop{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#backdrop .bd{width:100%;height:100%;opacity:.38}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 18px 22px}
.icon-btn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:active{background:var(--paper2)}
.btn{display:block;width:100%;min-height:52px;border:2px solid var(--ink);border-radius:var(--wobble);background:var(--card-face);color:#3d372f;font:22px/1 var(--hand);margin-top:10px;transition:transform .12s;box-shadow:3px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--accent);color:#fffaf1}
.btn.ghost{box-shadow:none;border-style:dashed;background:none;color:var(--ink)}
.btn.small{width:auto;min-height:42px;padding:0 20px;margin:0;font-size:19px;box-shadow:2px 3px 0 var(--ink)}
.hand{font-family:var(--hand)}

/* HUD (sketch: profile · level · score) */
.hud{display:flex;align-items:center;gap:8px;height:68px}
.avatar{width:46px;height:46px;border-radius:50%;border:2px solid var(--ink);background:var(--card-face);display:grid;place-items:center;padding:0;flex:none;overflow:hidden}
.avatar .art{width:42px;height:36px}
.avatar.big{width:76px;height:76px}.avatar.big .art{width:68px;height:58px}
.who{flex:1;display:flex;flex-direction:column;line-height:1.15}
.who b{font:24px var(--hand)}.who small{color:var(--muted);font-size:13px}
.level{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.05;text-align:center}
.level small{font-size:13px;color:var(--muted)}
.level b{font:24px var(--hand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.score{display:flex;align-items:center;gap:4px;padding:5px 12px 5px 8px;border:2px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;font:24px/1 var(--hand);min-width:70px;justify-content:center}
.score.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:scale(1.18) rotate(-4deg)}}

/* Home */
.home-title{margin:16px 0 4px;font:44px/1 var(--hand);letter-spacing:-.5px;position:relative}
.home-title i{font-style:normal;color:var(--accent)}
.home-title svg{position:absolute;right:4px;top:-6px}
.home-sub{color:var(--muted);margin:0 0 18px;font-size:15px}
#home-themes{display:grid;gap:18px}
.poster{position:relative;display:grid;grid-template-columns:1fr 132px;grid-template-rows:auto auto 1fr auto;text-align:left;padding:18px 18px 16px;border:2px solid var(--ink);border-radius:var(--wobble);background:var(--card-face);color:#3d372f;box-shadow:4px 5px 0 var(--ink);min-height:200px;transition:transform .15s}
.poster:nth-child(2){border-radius:var(--wobble2);transform:rotate(.6deg)}
.poster:first-child{transform:rotate(-.6deg)}
.poster:active{transform:translate(2px,3px)}
.poster-native{font:600 38px/1.1 var(--jp);grid-column:1}
.poster.vn .poster-native{font:40px/1.05 var(--hand)}
.poster-en{font:20px var(--hand);color:#8a8072;grid-column:1;letter-spacing:3px}
.poster-art{grid-column:2;grid-row:1/4;display:grid;place-items:center}.poster-art .art{width:140px;height:118px}
.poster-foot{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;border-top:1.5px dashed #cdbfa6;padding-top:10px;margin-top:8px;font-size:14px;color:#8a8072}
.poster-foot .lv{font:21px var(--hand);color:#3d372f}
.poster-go{position:absolute;right:14px;top:-14px;font:19px/1 var(--hand);background:var(--yellow);color:#3d372f;border:2px solid #3d372f;padding:6px 14px;border-radius:var(--wobble2);transform:rotate(4deg)}
.poster.jp .poster-go{background:#f7c6bd}.poster.vn .poster-go{background:#bfe3d0}.poster.tw .poster-go{background:#cfe0f5}
.poster.tw .poster-native{font:40px/1.1 var(--tc)}
body[data-theme="tw"] .map-title h1{font:40px/1.1 var(--tc)}
.poster:nth-child(3){transform:rotate(-.4deg)}

/* Journey map */
.map-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.map-title h1{margin:0;font:600 40px/1.1 var(--jp)}
body[data-theme="vn"] .map-title h1{font:42px/1.05 var(--hand);font-weight:400}
.map-title p{margin:0;font:18px var(--hand);color:var(--muted)}
.map-blurb{margin:6px 0 0;font-size:19px;color:var(--muted)}
.trail-wrap{position:relative;margin-top:16px}
.trail{position:absolute;inset:0;width:100%;height:100%}
.trail path{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:1 9;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.55}
.stops{list-style:none;margin:0;padding:0}
.stop{position:absolute;transform:translate(-40px,-40px)}
.stop.r{transform:translate(40px,-40px)}
.stop button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0;text-align:left}
.stop.r button{flex-direction:row-reverse;text-align:right}
.node{position:relative;width:80px;height:80px;flex:none;border-radius:50%;border:2px solid #3d372f;background:var(--card-face);display:grid;place-items:center;box-shadow:3px 4px 0 #3d372f;transition:transform .15s}
.node .art{width:64px;height:54px}
.stop button:active:not(:disabled) .node{transform:translate(2px,3px);box-shadow:1px 1px 0 #3d372f}
.stop.locked .node{background:var(--paper2);border-style:dashed;box-shadow:none;color:var(--muted)}
.stop.done .node{background:#eef6e6}
.stop.wander .node{border-radius:var(--wobble);width:88px}
.lock{display:grid;place-items:center}
.tick{position:absolute;right:-4px;top:-4px;width:24px;height:24px;border-radius:50%;background:var(--mint);border:2px solid #3d372f;color:#fff;font:700 13px/20px var(--body);text-align:center;font-style:normal}
.me-pin{position:absolute;left:50%;top:-30px;width:38px;height:38px;margin-left:-19px;border-radius:50%;border:2px solid #3d372f;background:#fffcf4;display:grid;place-items:center;animation:bob 2.2s ease-in-out infinite}
.me-pin .art{width:32px;height:28px}
.me-pin::after{content:"";position:absolute;bottom:-7px;left:50%;margin-left:-5px;border:5px solid transparent;border-top-color:#3d372f}
@keyframes bob{50%{transform:translateY(-4px)}}
.stop-text{display:flex;flex-direction:column;line-height:1.15;width:max-content;max-width:min(52vw,220px)}
.stop-text small{font-size:12.5px;color:var(--muted)}
.stop-text b{font:23px/1.05 var(--hand);font-weight:400;color:var(--ink)}
.stop-text em{font:italic 13px var(--body);font-style:normal;color:var(--muted)}
.stop.here .stop-text em{color:var(--accent);font-weight:700}
.stop.locked .stop-text{opacity:.55}
.journey-note{font-size:19px;margin:8px 0 0;color:var(--ink)}

/* Game */
#game{display:flex;flex-direction:column;overflow:hidden;padding-bottom:10px}
.progress-row{display:flex;align-items:center;gap:10px;margin:2px 2px 0}
.bar{flex:1;height:10px;border:1.8px solid var(--ink);border-radius:var(--wobble);overflow:hidden;background:var(--card-face)}
#bar-fill{height:100%;width:0;background:repeating-linear-gradient(115deg,var(--accent) 0 5px,color-mix(in srgb,var(--accent) 70%,#fff) 5px 8px);transition:width .5s cubic-bezier(.3,.8,.3,1)}
#pair-count{font:18px var(--hand);white-space:nowrap}
#board-wrap{flex:1;min-height:0;display:grid;place-items:center;margin:8px 0 4px}
#grid.deal .card{animation:deal .5s cubic-bezier(.25,1.3,.5,1) both}
@keyframes deal{from{opacity:0;transform:translateY(28px) scale(.82) rotate(-4deg)}}
.front .art{transition:none}
#grid{display:grid;grid-template-columns:repeat(4,var(--cw,76px));grid-auto-rows:calc(var(--cw,76px)*1.2);gap:var(--gap,9px);perspective:900px}
.card{border:0;padding:0;background:none;position:relative;user-select:none;-webkit-user-select:none}
.card:nth-child(5n+2){rotate:.8deg}.card:nth-child(7n+3){rotate:-.9deg}.card:nth-child(4n+4){rotate:.4deg}
.card .inner{position:absolute;inset:0;-webkit-transform-style:preserve-3d;transform-style:preserve-3d;transition:transform .42s cubic-bezier(.3,.7,.3,1)}
.card.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1.8px solid #3d372f;border-radius:var(--wobble);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}
.back{background:var(--card-back-img) center/cover,#f3ead8;box-shadow:2px 3px 0 #3d372f;-webkit-transform:rotateY(0deg) translateZ(.5px);transform:rotateY(0deg) translateZ(.5px)}
.front{background:var(--card-face);-webkit-transform:rotateY(180deg) translateZ(.5px);transform:rotateY(180deg) translateZ(.5px);padding:4px 3px;color:#3d372f;box-shadow:2px 3px 0 #3d372f}
.front .art{width:88%;height:auto;max-height:58%}
.front .label{font:clamp(11px,calc(var(--cw,76px)*.16),15px)/1.05 var(--hand);text-align:center;padding:0 2px;margin-top:2px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical}
.front .sub{font:600 clamp(8px,calc(var(--cw,76px)*.105),11px)/1.15 var(--body);color:#8a8072;text-align:center;padding:0 3px;margin-top:1px;max-width:100%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.front .label:lang(ja){font:600 clamp(10px,calc(var(--cw,76px)*.14),13px)/1.1 var(--jp)}
.front .label:lang(zh-Hant){font:400 clamp(10px,calc(var(--cw,76px)*.14),13px)/1.1 var(--tc)}
#grid.tiny .front .label{-webkit-line-clamp:1}#grid.tiny .front .sub{-webkit-line-clamp:1}#grid.tiny .front .art{max-height:84%}
.card.found .front{background:#eef6e6}
.card.found .front::after{content:"";position:absolute;inset:3px;border:1.5px dashed #5aa889;border-radius:var(--wobble2)}
.card:disabled{cursor:default}
.card:active:not(:disabled):not(.open) .inner{transform:scale(.95)}
.card.pop .inner{animation:pop .55s ease}
@keyframes pop{40%{transform:rotateY(180deg) scale(1.1) rotate(-3deg)}100%{transform:rotateY(180deg)}}
.game-foot{display:flex;align-items:center;gap:8px;flex:none}
#status{flex:1;font:19px/1.15 var(--hand);color:var(--muted);margin:0;min-height:42px;display:flex;align-items:center}
.pill{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border:2px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;font:19px var(--hand);box-shadow:2px 3px 0 var(--ink);flex:none}
.pill:active:not(:disabled){transform:translate(1px,2px);box-shadow:1px 1px 0 var(--ink)}
.pill:disabled{opacity:.45;box-shadow:none}
#restart{width:44px;padding:0;justify-content:center}
.fly{position:fixed;z-index:60;pointer-events:none;font:30px/1 var(--hand);color:var(--accent);-webkit-text-stroke:.5px #3d372f;text-shadow:2px 2px 0 #fffaf1}

/* Challenge note (sketch: card over the board, +2, skip) */
#challenge{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:20px calc(16px + env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background:var(--veil);opacity:0;transition:opacity .22s}
#challenge.in{opacity:1}
.note{position:relative;width:100%;max-width:400px;max-height:100%;overflow-y:auto;background:var(--card-face);color:#3d372f;border:2px solid #3d372f;border-radius:var(--wobble);box-shadow:5px 6px 0 #3d372f;padding:22px 20px 16px;transform:translateY(24px) rotate(-1.5deg) scale(.96);transition:transform .32s cubic-bezier(.2,1.2,.4,1)}
#challenge.in .note{transform:rotate(-.8deg)}
.tape{position:absolute;top:-2px;left:50%;width:92px;height:24px;transform:translateX(-50%) rotate(-3deg);background:color-mix(in srgb,var(--yellow) 60%,transparent);border-left:2px dotted rgba(0,0,0,.08);border-right:2px dotted rgba(0,0,0,.08)}
.note-head{display:flex;align-items:center;gap:12px}
.note-art{width:92px;height:78px;flex:none}.note-art .art{width:100%;height:100%}
.nat{font:30px/1.1 var(--hand);margin:0}
.nat:lang(ja){font:600 26px/1.2 var(--jp)}
.nat:lang(zh-Hant){font:400 26px/1.2 var(--tc)}
.en{font:18px/1.2 var(--hand);color:#8a8072;margin:2px 0 0}
.story{font-size:14px;line-height:1.55;margin:12px 0 0;color:#5a5246}
.bonus-row{display:flex;align-items:center;gap:10px;border-top:1.5px dashed #cdbfa6;margin-top:14px;padding-top:14px}
.bonus-ribbon{white-space:nowrap;flex:none;font:19px/1 var(--hand);color:#3d372f;background:var(--yellow);border:2px solid #3d372f;padding:5px 12px 4px 10px;border-radius:var(--wobble2);box-shadow:2px 3px 0 #3d372f;transform:rotate(-2deg);animation:ribbon 2.4s ease-in-out infinite}
@keyframes ribbon{50%{transform:rotate(1deg) scale(1.04)}}
.bonus-hint{font:17px/1.1 var(--hand);color:#8a8072}
.q-row{display:flex;align-items:center;gap:14px;margin-top:10px}
.worth .burst{position:absolute;inset:-14px;border-radius:50%;background:repeating-conic-gradient(var(--yellow) 0 9deg,transparent 9deg 20deg);-webkit-mask:radial-gradient(circle,#000 45%,transparent 70%);mask:radial-gradient(circle,#000 45%,transparent 70%);opacity:.75;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.worth .coin{position:absolute;inset:0;border-radius:50%;background:var(--yellow);border:2.5px solid #3d372f;box-shadow:2px 3px 0 #3d372f;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3d372f;transform:rotate(8deg);animation:coin 1.8s ease-in-out infinite}
@keyframes coin{50%{transform:rotate(-4deg) scale(1.08)}}
.worth .coin b{font:28px/.85 var(--hand);font-weight:400}
.worth .coin small{font:12px/1 var(--hand);margin-top:2px}
.worth.won .coin{background:#bfe3d0;animation:coinwin .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes coinwin{0%{transform:scale(.7)}60%{transform:scale(1.3) rotate(-10deg)}100%{transform:scale(1) rotate(8deg)}}
.worth.won .burst{background:repeating-conic-gradient(#5aa889 0 9deg,transparent 9deg 20deg);inset:-24px;opacity:.9}
.worth.lost .coin{background:#ece6d8;color:#a59c8d;animation:none}
.worth.lost .burst{display:none}
.fly.bonus{font-size:36px;color:#e5a52a;white-space:nowrap}
.feedback.win{font-size:24px;color:#2f8a6a}
.q{flex:1;margin:0;font:21px/1.2 var(--hand)}
.worth{flex:none;position:relative;width:66px;height:66px;margin:6px 6px 6px 0}
.answer{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;margin:9px 0 0;padding:8px 14px;border:1.8px solid #3d372f;border-radius:var(--wobble2);background:#fffcf4;color:#3d372f;text-align:left;font-size:15px;font-weight:600}
.answer .mark{width:18px;height:18px;border:1.8px solid #3d372f;border-radius:50%;flex:none;display:grid;place-items:center;font:16px/1 var(--hand)}
.answer.right{background:#dcefd9}.answer.right .mark::after{content:"✓";color:#2f8a6a}
.answer.wrong{background:#f8dcd6}.answer.wrong .mark::after{content:"✗";color:#c0392b}
.answer:disabled{opacity:1}.answer:disabled:not(.right):not(.wrong){opacity:.5}
.note-foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.feedback{flex:1;margin:0;font:18px/1.15 var(--hand);color:#8a8072}

/* Next level */
#done{position:fixed;inset:0;z-index:45;background:var(--paper);overflow-y:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px));opacity:0;transition:opacity .3s}
#done.in{opacity:1}
.done-sheet{max-width:440px;margin:0 auto}
.done-top{display:flex;align-items:center;gap:16px;margin-top:10px}
.stamp{width:92px;height:92px;flex:none;border:2.5px solid var(--accent);color:var(--accent);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 22px/1 var(--jp);transform:rotate(-12deg);animation:stamp .6s cubic-bezier(.3,1.5,.5,1) both}
.stamp:lang(vi){font:22px/1 var(--hand)}
.stamp:lang(zh-Hant){font:24px/1 var(--tc)}
.stamp small{font:14px var(--hand);margin-top:6px}
@keyframes stamp{from{transform:rotate(-12deg) scale(1.7);opacity:0}}
.done-top h2{font:34px/1.05 var(--hand);margin:0}
.done-top p{margin:4px 0 0;color:var(--muted);font-size:18px}
.earned{display:flex;align-items:center;gap:8px;margin:16px 0 4px;font:20px var(--hand);color:var(--muted)}
.earned b{font:34px/1 var(--hand);color:var(--ink)}
.list-title{font:22px var(--hand);margin:12px 0 6px}
.poster-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.poster-list li,.poster-list li>button{display:flex;align-items:center;gap:8px;min-width:0}
.poster-list li>button{width:100%;border:0;background:none;padding:0;text-align:left}
.pl-art{width:62px;height:54px;flex:none;display:grid;place-items:center}.pl-art .art{width:62px;height:53px}
.pl-text{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.pl-text b{font:19px/1.1 var(--hand);font-weight:400}
.pl-text b:lang(ja){font:600 15px/1.25 var(--jp)}
.pl-text b:lang(zh-Hant){font:400 15px/1.25 var(--tc)}
.pl-text small{font-size:12px;color:var(--muted)}
.tier{display:inline-flex;align-items:center;gap:3px;width:max-content;margin-top:3px;padding:1px 8px 0;border-radius:var(--wobble2);border:1.5px solid #3d372f;font:13px/1.35 var(--hand);color:#3d372f;white-space:nowrap}
.tier.t-common{background:#ebe6da;color:#6f675a;border-color:#b9b09f}
.tier.t-uncommon{background:#cfeadb}
.tier.t-rare{background:#cfe0f5;color:#2b4a7a}
.tier.t-legendary{background:linear-gradient(110deg,#f2c14e 30%,#fff3b8 45%,#f2c14e 60%);background-size:250% 100%;animation:shimmer 2.6s linear infinite;font-weight:700}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.tier-art{position:relative;border-radius:50%}
.tier-art.t-rare{background:radial-gradient(circle,rgba(143,193,227,.45) 0 55%,transparent 70%)}
.tier-art.t-legendary{background:radial-gradient(circle,rgba(242,193,78,.55) 0 55%,transparent 72%)}
.tier-art.t-legendary::after{content:"✦";position:absolute;right:2px;top:-2px;color:#e5a52a;font-size:14px;animation:twinkle 1.8s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25;transform:scale(.7)}}
.journal li.empty .pl-art.t-legendary{border-color:#e5a52a;color:#e5a52a}
.journal li.empty .pl-art.t-rare{border-color:#7aa3d6;color:#3e5f93}
.journal li.empty .tier{opacity:.7}
.tier-sum{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.tier-sum span{display:flex;align-items:center;gap:4px;padding:3px 10px;border:1.5px solid var(--line);border-radius:var(--wobble2);font:16px var(--hand);color:var(--ink)}
.tier-sum i{font-style:normal}
.tier-sum .t-legendary i{color:#e5a52a}.tier-sum .t-rare i{color:#3e5f93}.tier-sum .t-uncommon i{color:#2f8a6a}.tier-sum .t-common i{color:#a59c8d}
.rare-count{font-size:17px;color:#fffaf1;background:var(--accent);padding:1px 10px;border-radius:var(--wobble2);margin-left:6px;display:inline-block;transform:rotate(-2deg)}
.note-head .tier{margin-top:5px}
.done-actions{margin-top:18px}

/* Challenge auto-advance */
.auto-bar{position:absolute;left:18px;right:18px;bottom:8px;height:3px;border-radius:2px;background:var(--accent);transform-origin:left;animation:drain linear forwards;opacity:.6}
@keyframes drain{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.note-foot{min-height:42px}

/* Celebration */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.done-sheet{position:relative;z-index:1}
.stars{display:flex;justify-content:center;gap:10px;margin:14px 0 2px}
.big-star svg{width:54px;height:54px;opacity:.18;filter:grayscale(1)}
.big-star:nth-child(2) svg{width:66px;height:66px;margin-top:-10px}
.big-star.earned svg{opacity:1;filter:none;animation:starpop .5s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d)}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg);opacity:0}100%{transform:scale(1);opacity:1}}
.star-tip{text-align:center;margin:0;color:var(--muted);font-size:17px}
#count.pop{animation:bump .45s ease}
.earned{justify-content:center}
.rank-line{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin:8px 0 0;padding:10px 12px;border:1.8px dashed var(--line);border-radius:var(--wobble2);background:none;font:19px var(--hand);color:var(--ink)}
.rank-line b{font-weight:400;color:var(--accent);font-size:22px}
.rank-line .up{color:#2f8a6a;font-size:18px;animation:bump .6s ease 1.6s both}
.reward{display:flex;align-items:center;gap:12px;margin:14px 0 0;padding:12px 14px;border:2px solid #3d372f;border-radius:var(--wobble);background:#fff7d6;color:#3d372f;box-shadow:3px 4px 0 #3d372f;animation:rewardin .5s cubic-bezier(.3,1.4,.5,1) 1.7s both}
@keyframes rewardin{from{transform:translateY(16px) scale(.9);opacity:0}}
.reward-art{width:64px;height:56px;flex:none;animation:wiggle 1.6s ease-in-out 2.2s 2}
.reward-art .art{width:64px;height:56px}
@keyframes wiggle{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.reward>span:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.15}
.reward small{font:16px var(--hand);color:#c0392b}
.reward b{font:22px var(--hand);font-weight:400}.reward b:lang(ja){font:600 18px var(--jp)}
.reward b{font:22px var(--hand);font-weight:400}.reward b:lang(zh-Hant){font:400 18px var(--tc)}
.reward em{font-style:normal;font-size:12.5px;color:#8a8072}
.mini-stars{color:#e5a52a;letter-spacing:1px}
.av-note{margin:0 0 4px;font-size:13px;color:var(--muted)}
.av-locked{flex:none;width:52px;height:52px;border-radius:50%;border:1.8px dashed var(--line);display:grid;place-items:center;color:var(--muted)}

/* Memory */
.mem-card{margin:14px 0 0;padding:14px 16px;border:2px solid #3d372f;border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;box-shadow:3px 4px 0 #3d372f;animation:rewardin .5s cubic-bezier(.3,1.4,.5,1) 1.4s both}
.mem-head{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.mem-score{flex:none;width:76px;height:76px;border-radius:50%;border:2.5px solid #3d372f;background:#cfe0f5;display:flex;align-items:baseline;justify-content:center;padding-top:16px;transform:rotate(-6deg)}
.mem-score b{font:34px/1 var(--hand);font-weight:400}.mem-score small{font:13px var(--hand);color:#5a5246}
.mem-head small{font:15px var(--hand);color:#3e5f93}.mem-head p{margin:2px 0 0;font:17px/1.2 var(--hand)}
.mem-row{display:flex;align-items:center;gap:10px;margin:6px 0;font:17px var(--hand)}
.mem-row>span:first-child{width:96px;flex:none}
.mbar{flex:1;height:10px;border:1.6px solid #3d372f;border-radius:var(--wobble);overflow:hidden;background:#fffcf4}
.mbar i{display:block;height:100%;background:repeating-linear-gradient(115deg,#3e5f93 0 5px,#6f8fb4 5px 8px);transition:width .8s cubic-bezier(.3,.8,.3,1)}
.mem-row b{width:44px;text-align:right;font-weight:400}
.mem-facts{margin:6px 0 0;font-size:13px;color:#8a8072}
.mem-link{margin-top:8px;padding:0;border:0;background:none;font:18px var(--hand);color:#3e5f93}
.note.review .tape{background:color-mix(in srgb,#8fc1e3 70%,transparent)}
.bonus-row.first{border-top:0;margin:0 0 12px;padding:0}
.bonus-ribbon.mint{background:#cfe0f5}
.met{margin:3px 0 0;font:15px var(--hand);color:#3e5f93}
.story.recap{background:#f5efe0;border-radius:10px;padding:8px 10px}
.check-banner,.ins-entry{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 16px;padding:12px 14px;border:2px solid #3d372f;border-radius:var(--wobble2);background:#cfe0f5;color:#3d372f;text-align:left;box-shadow:3px 4px 0 #3d372f}
.ins-entry{background:var(--card-face);margin:16px 0 0}
.check-banner>span:nth-child(2),.ins-entry>span:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.2}
.check-banner b,.ins-entry b{font:22px var(--hand);font-weight:400}
.check-banner small,.ins-entry small{font-size:13px;color:#5a5246}
.ins-ico{width:40px;height:40px;flex:none;border-radius:50%;border:2px solid #3d372f;background:#fffcf4;display:grid;place-items:center;font-size:20px;color:#3e5f93}
.check-banner .go{font:22px var(--hand);background:var(--yellow);border:2px solid #3d372f;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;transform:rotate(6deg);animation:coin 1.8s ease-in-out infinite}
.ins-sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.ins-card{margin:0 0 16px;padding:14px 16px;border:2px solid var(--ink);border-radius:var(--wobble);background:var(--card-face);color:#3d372f}
.ins-card h2{margin:0 0 8px;font:26px var(--hand);font-weight:400}
.ins-big{display:flex;gap:8px;margin-bottom:6px}
.ins-big div{flex:1;display:flex;flex-direction:column;text-align:center;padding:6px 4px;border:1.5px dashed #cdbfa6;border-radius:var(--wobble2)}
.ins-big b{font:30px/1.1 var(--hand);font-weight:400}.ins-big small{font-size:11.5px;color:#8a8072;line-height:1.2}
.spark{width:100%;height:76px;margin:6px 0 0}
.ins-cap{margin:2px 0 8px;font-size:12.5px;color:#8a8072}
.ins-empty{font-size:19px;color:#8a8072;margin:4px 0 8px}
.ins-card .mem-row>span:first-child{width:118px}
.ins-how{margin:0 0 20px;padding:12px 14px;border:1.8px dashed var(--line);border-radius:var(--wobble2);color:var(--ink)}
.ins-how summary{font:20px var(--hand);cursor:pointer}
.ins-how p{font-size:13.5px;line-height:1.55;margin:8px 0 0}

.story.revealed{background:#f5efe0;border-radius:10px;padding:8px 10px;animation:fadein .4s}
/* Wardrobe */
.dress-btn{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 14px;padding:10px 14px;border:2px solid #3d372f;border-radius:var(--wobble);background:#fff7d6;color:#3d372f;text-align:left;box-shadow:3px 4px 0 #3d372f}
.dress-btn .dress-fig{width:54px;height:58px;flex:none}.dress-btn .dress-fig .art{width:54px;height:58px}
.dress-btn>span:nth-child(2){flex:1;display:flex;flex-direction:column;line-height:1.2}
.dress-btn b{font:24px var(--hand);font-weight:400}.dress-btn small{font-size:13px;color:#5a5246}
.small-pill{height:40px;padding:0 14px;font-size:18px}
.stage{position:relative;height:300px;display:grid;place-items:center;margin:0 0 4px;border:2px solid var(--ink);border-radius:var(--wobble);background:var(--card-face);overflow:hidden}
.stage .rug{position:absolute;left:50%;bottom:22px;width:190px;height:34px;margin-left:-95px;border-radius:50%;background:repeating-linear-gradient(90deg,#f2c14e 0 10px,#e2574c 10px 20px,#3e88b8 20px 30px,#5aa97c 30px 40px);opacity:.35}
.stage .traveler-big{position:relative;width:250px;height:264px}
.stage.pop .traveler-big{animation:dresspop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes dresspop{0%{transform:scale(.92) rotate(-2deg)}60%{transform:scale(1.04) rotate(1deg)}100%{transform:none}}
.ward-count{text-align:center;margin:8px 0 6px;font:18px var(--hand);color:var(--muted)}
.ward-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0}
.ward-tabs button{display:flex;flex-direction:column;align-items:center;min-width:0;padding:6px 2px;border:1.8px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;font:18px/1.1 var(--hand)}
.ward-tabs button small{font:11px var(--body);color:#8a8072}
.ward-tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}.ward-tabs button[aria-selected="true"] small{color:var(--paper)}
.ward-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.ward-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:118px;padding:8px 6px;border:1.8px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;text-align:center}
.ward-item .art{width:70px;height:60px}
.ward-item span{font:16px/1.1 var(--hand)}.ward-item span:lang(ja){font:600 14px/1.2 var(--jp)}.ward-item span:lang(zh-Hant){font:15px/1.2 var(--tc)}
.ward-item small{font-size:11px;color:#8a8072;line-height:1.2}
.ward-item[aria-pressed="true"]{border-width:3px;border-color:var(--accent);background:#fff3c4}
.ward-item.locked{border-style:dashed;background:none;color:var(--muted)}.ward-item.locked .lock-ico{display:grid;place-items:center;height:44px}
.ward-item .none-mark{font:32px var(--hand);height:60px;display:grid;place-items:center;color:#8a8072}
.ward-label{margin:4px 0 8px;font:20px var(--hand)}
.swatches{display:flex;gap:12px;margin-bottom:14px}
.sw{width:44px;height:44px;border-radius:50%;border:2px solid var(--ink)}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px}
.reward-art.tall{width:64px;height:68px}.reward-art.tall .art{width:64px;height:68px}
.avatars button img.art{width:44px;height:44px}

/* Travel economy */
.score.coins{min-width:64px;margin-left:6px}.coin-ico{flex:none}
.hud .score.coins{padding-left:6px}
.market-banner{background:#fff3c4}
.poster.locked-dest .poster-art{filter:grayscale(.7);opacity:.6}
.poster.locked-dest .poster-native,.poster.locked-dest .poster-en{opacity:.6}
.poster.locked-dest .poster-foot span:last-child{display:flex;align-items:center;gap:3px}
.poster.locked-dest .poster-go{background:#fffaf1}
.coins-earned b{color:#c9922e!important}
.wallet{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border:2px solid #3d372f;border-radius:var(--wobble);background:#fff3c4;color:#3d372f;box-shadow:3px 4px 0 #3d372f}
.wallet .coin-ico{width:34px;height:34px}.wallet b{font:40px/1 var(--hand);font-weight:400}.wallet span{font:18px var(--hand);color:#5a5246}
.wallet.bump{animation:bump .5s ease}
.next-ticket{text-align:center;margin:10px 0 0;font:18px var(--hand);color:var(--muted)}
.demand{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 12px;border:1.8px dashed var(--accent);border-radius:var(--wobble2);font-size:14px}
.dm-ico{color:var(--accent);font-size:18px}
.spares li>button{padding:6px 0;border-bottom:1px dashed var(--line);border-radius:0}
.poster-list.spares{grid-template-columns:1fr}
.sp-meta{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font:20px/1 var(--hand)}.sp-meta small{font:12px var(--body);color:var(--muted);margin-top:4px}
.bid-now{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;padding:10px 14px;border:2px solid #3d372f;border-radius:var(--wobble2);background:#fff3c4}
.bid-now small{font:18px var(--hand);color:#5a5246}.bid-now span{display:flex;align-items:center;gap:6px}.bid-now b{font:34px/1 var(--hand);font-weight:400}
.bid-now.bump{animation:bump .45s ease}
.bids{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;max-height:210px;overflow-y:auto}
.bids li{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1.5px solid #cdbfa6;border-radius:var(--wobble2);animation:fadein .35s}
.bids li .avatar{width:36px;height:36px}.bids li .avatar .art{width:32px;height:28px}
.bids .who-col b{font:18px var(--hand)}.bids .who-col small{font-size:11.5px}
.bids .pts{font:22px var(--hand)}
.bids li.waiting,.bids li.settled{border:0;justify-content:center;font-size:17px;color:#8a8072}
.au-actions{margin-top:10px}
.tk{display:flex;border:2px solid #3d372f;border-radius:14px;background:#fffaf1;color:#3d372f;overflow:hidden;margin:6px 0 12px;box-shadow:3px 4px 0 #3d372f}
.tk-main{flex:1;padding:12px 14px;display:flex;flex-direction:column;border-right:2px dashed #3d372f}
.tk-main small{font:15px var(--hand);color:#8a8072}.tk-main b{font:28px/1.2 var(--hand);font-weight:400}.tk-main em{font-style:normal;font-size:13px;color:#8a8072}
.tk-stub{width:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:#fff3c4}.tk-stub b{font:24px var(--hand);font-weight:400}
.flight{max-width:440px;margin:0 auto;text-align:center}
.flight-map{width:100%;height:auto;border:2px solid #3d372f;border-radius:18px;margin-top:10px}
.arrive{margin-top:12px}.arrive h2{font:34px var(--hand);margin:10px 0 4px;font-weight:400}.arrive p{font-size:19px;color:var(--muted);margin:0 0 6px}
.big-stamp{margin:0 auto}

/* Motion tutorial */
#coach{position:fixed;inset:0;z-index:55;pointer-events:none}
#coach.out{opacity:0;transition:opacity .22s}
#coach .spot{position:fixed;border-radius:18px;box-shadow:0 0 0 9999px rgba(28,24,20,.48);outline:2.5px dashed #f2c14e;outline-offset:2px;animation:spotin .36s ease-out both}
@keyframes spotin{from{opacity:0;transform:scale(1.15)}}
#coach .tip{position:fixed;transform:translateX(-50%) rotate(-1.5deg);background:#fffaf1;color:#3d372f;border:2px solid #3d372f;border-radius:var(--wobble2);box-shadow:3px 4px 0 #3d372f;font:23px/1.1 var(--hand);padding:7px 16px 6px;white-space:nowrap;animation:tipin .48s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tipin{from{opacity:0;transform:translateX(-50%) scale(.6)}}
#coach svg.arrow{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:visible}
#coach .arrow path{fill:none;stroke:#f2c14e;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw .54s .24s ease-out forwards}
#coach .arrow path+path{animation-delay:.72s}
@keyframes draw{to{stroke-dashoffset:0}}
#coach .arrow g{animation:nudge 1.32s ease-in-out 1.2s infinite}
@keyframes nudge{50%{transform:translate(var(--dx),var(--dy))}}
#coach .ripple{position:fixed;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;border:3px solid #fffaf1;opacity:0;animation:ripple 1.92s ease-out .96s infinite}
#coach .ripple.b{animation-delay:1.92s}
@keyframes ripple{0%{transform:scale(.4);opacity:.95}100%{transform:scale(1.5);opacity:0}}
html.calm #coach .arrow g,html.calm #coach .ripple{animation:none!important}
html.calm #coach .ripple{opacity:.8}

/* Leaderboard */
button.score{cursor:pointer}
.board-sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.board-msg{padding:22px 4px;color:var(--muted);text-align:center}
.board-msg p{margin:0 0 8px}.board-msg .hand{font-size:22px;color:var(--ink)}
.board-msg.small{padding:0 0 10px;font-size:13px;text-align:left}
.you-card{display:flex;align-items:center;gap:12px;padding:12px 16px;border:2px solid #3d372f;border-radius:var(--wobble);background:var(--accent);color:#fffaf1;box-shadow:3px 4px 0 #3d372f;margin-bottom:16px}
.you-card .avatar{border-color:#3d372f}
.you-card small{display:block;font-size:12px;opacity:.85}.you-card b{font:34px/1 var(--hand);font-weight:400}
.you-card>div:nth-child(2){flex:1}
.you-pts{display:flex;align-items:center;gap:4px}.you-pts b{font-size:28px}
.ranks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.ranks li{display:flex;align-items:center;gap:10px;padding:8px 12px;border:1.8px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f}
.ranks li.me{background:#fff3c4;border-width:2.5px}
.ranks .pos{width:30px;text-align:center;font:22px var(--hand)}
.medal{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2px solid #3d372f;font:18px/1 var(--hand)}
.m1{background:#f2c14e}.m2{background:#d9dde3}.m3{background:#e3a876}
.ranks .avatar{width:40px;height:40px}.ranks .avatar .art{width:36px;height:31px}
.who-col{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}
.who-col b{font:20px var(--hand);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-col em{font-style:normal;color:#8a8072;font-size:15px}
.who-col small{font-size:12px;color:#8a8072}
.pts{font:24px var(--hand)}

/* Profile */
.p-head{display:flex;align-items:center;justify-content:space-between;height:60px;margin:0 -8px}
.p-head h1{font:28px var(--hand);margin:0}
.me{display:flex;align-items:center;gap:14px;margin:6px 0 12px}
.name-field{flex:1}
.name-field input{width:100%;font:30px var(--hand);border:0;border-bottom:2px dashed var(--line);background:none;padding:4px 2px;border-radius:0}
.avatars{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px}
.avatars button{flex:none;width:52px;height:52px;border-radius:50%;border:1.8px dashed var(--line);background:var(--card-face);display:grid;place-items:center;padding:0}
.avatars button .art{width:44px;height:38px}
.avatars button[aria-checked="true"]{border:2.5px solid var(--accent)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
.stats div{border:2px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.stats b{font:30px/1 var(--hand)}.stats small{font-size:12px;color:#8a8072}
.j-title{font:28px var(--hand);margin:22px 0 10px;font-weight:400}
.seg{display:flex;border:2px solid var(--ink);border-radius:var(--wobble);overflow:hidden;margin-bottom:14px}
.seg button{flex:1;height:42px;border:0;background:none;font:20px var(--hand)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.journal li.empty .pl-art{border:1.8px dashed var(--line);border-radius:var(--wobble2);font:24px var(--hand);color:var(--muted);width:54px;height:48px;margin:3px 4px}
.journal li.empty .pl-text b{color:var(--muted)}
.journal{gap:8px 12px}

/* Sheet */
dialog#sheet{border:2px solid #3d372f;border-bottom:0;padding:0;margin:auto auto 0;width:100%;max-width:480px;max-height:90%;background:var(--card-face);color:#3d372f;border-radius:22px 22px 0 0;animation:up .3s cubic-bezier(.2,.8,.25,1)}
dialog#sheet.leaving{animation:down .2s ease-in forwards}
dialog#sheet::backdrop{background:rgba(50,40,30,.35)}
@keyframes up{from{transform:translateY(100%)}}@keyframes down{to{transform:translateY(100%)}}
#sheet-body{padding:12px 22px calc(22px + env(safe-area-inset-bottom,0px));overflow-y:auto;max-height:90vh}
#sheet-body:focus{outline:none}
.grip{width:40px;height:5px;border-radius:3px;background:#d9cfbc;margin:10px auto 0}
#sheet h2{font:30px/1.1 var(--hand);margin:8px 0 10px;font-weight:400}
#sheet p{margin:0 0 10px;line-height:1.55}
#sheet .en{margin-bottom:10px}
.sheet-art{height:130px;display:grid;place-items:center;margin:4px 0 8px}.sheet-art .art{width:160px;height:134px}

 /* Gentle motion: keeps flips and feedback, drops looping and travelling effects */
html.calm .me-pin,html.calm .worth .burst,html.calm .worth .coin,html.calm .bonus-ribbon,html.calm .tier.t-legendary,html.calm .tier-art.t-legendary::after,html.calm .reward-art,html.calm .check-banner .go{animation:none!important}
html.calm #grid.deal .card,html.calm .big-star.earned svg,html.calm .stamp,html.calm .reward,html.calm .mem-card,html.calm .card.pop .inner{animation-name:fadein!important}
html.calm .card.pop .inner{animation:none!important}
html.calm .card .inner{transition-duration:.3s}
@keyframes fadein{from{opacity:0}}
.motion-btn{min-height:36px;padding:0 14px;border:1.8px solid var(--ink);border-radius:var(--wobble2);background:var(--card-face);color:#3d372f;font:18px var(--hand)}
.app-version{margin:4px 0 0;font-size:12px;color:var(--muted);text-align:center}
@media (min-width:520px){.app{border-left:1.5px dashed var(--line);border-right:1.5px dashed var(--line)}}
@media (max-height:620px){.hud{height:56px}.avatar{width:40px;height:40px}}
</style>

const items={mochi:['Mochi','Soft, chewy mochi is made from glutinous rice. Despite its name, this rice contains no gluten.','What gives mochi its lovely chew?',['Glutinous rice','Wheat flour','Cornmeal'],0],onigiri:['Onigiri','These rice balls are often shaped into triangles and wrapped with nori, a type of seaweed.','What is the wrapper around an onigiri?',['Rice paper','Nori seaweed','Banana leaf'],1],matcha:['Matcha','Matcha is finely ground green tea. Instead of steeping leaves, you whisk the powder into water.','How is matcha usually prepared?',['Roasted in a pan','Whisked into water','Steeped as whole leaves'],1],taiyaki:['Taiyaki','This fish-shaped cake is often filled with sweet red bean paste. Its playful shape resembles a sea bream.','What is a traditional taiyaki filling?',['Sweet red bean paste','Pickled ginger','Soy sauce'],0],dango:['Dango','Dango are rice-flour dumplings. Pink, white, and green hanami dango are enjoyed during cherry blossom season.','Hanami dango celebrates which season?',['Winter','Autumn','Cherry blossom season'],2],sakura:['Sakura','Hanami is the custom of enjoying seasonal blossoms, especially cherry blossoms, with a picnic or a stroll.','What does hanami celebrate?',['Viewing blossoms','The first snowfall','The rice harvest'],0],banhmi:['Bánh mì','Bánh mì brings a crisp baguette together with fillings such as herbs, pickled vegetables, and savory proteins.','Which bread is used for bánh mì?',['Baguette','Pita','Brioche bun'],0],pho:['Phở','Phở is a Vietnamese noodle soup with fragrant broth, rice noodles, and often beef or chicken.','Phở traditionally uses what noodles?',['Buckwheat noodles','Rice noodles','Egg noodles'],1],coffee:['Cà phê sữa đá','Vietnamese iced milk coffee pairs strong coffee with sweetened condensed milk, often brewed using a phin filter.','What sweetens cà phê sữa đá?',['Honey','Coconut sugar','Condensed milk'],2],lotus:['Lotus','Lotus flowers flourish in Vietnam’s ponds. Their seeds and stems are also used in cooking.','Which part of the lotus is used in food?',['Only the petals','Seeds and stems','Only the roots'],1],lantern:['Hội An lantern','Hội An is known for its colorful lanterns. Silk lantern making is one of the town’s celebrated crafts.','Which town is famous for its lanterns?',['Hội An','Tokyo','Kyoto'],0],roll:['Gỏi cuốn','These fresh rolls wrap herbs, vegetables, rice noodles, and often shrimp or pork in delicate rice paper.','What wraps a fresh gỏi cuốn?',['Nori','Rice paper','Puff pastry'],1]};

(()=>{const TWD={"items": {"tw_bubbletea": ["Bubble tea", "Pearl milk tea was born in Taiwan in the 1980s: sweet milk tea with chewy tapioca pearls sipped through a wide straw.", "What are the chewy “pearls” in bubble tea?", ["Chocolate chips", "Tapioca balls", "Frozen grapes"], 1], "tw_xiaolongbao": ["Soup dumplings", "Xiaolongbao are delicate dumplings steamed in bamboo baskets. Each one hides a meat filling and a spoonful of hot broth.", "What surprise is inside a xiaolongbao?", ["Ice cream", "Hot soup", "A paper fortune"], 1], "tw_beefnoodle": ["Beef noodle soup", "Braised beef noodle soup is one of Taiwan’s best-loved dishes, with a rich broth simmered for hours and tender chunks of beef.", "What meat stars in 牛肉麵?", ["Duck", "Fish", "Beef"], 2], "tw_pineapplecake": ["Pineapple cake", "Pineapple cakes wrap a sweet pineapple filling in buttery pastry. In Taiwanese, the word for pineapple sounds like “prosperity comes,” so they make a lucky gift.", "What fills a classic pineapple cake?", ["Cheese", "Pineapple jam", "Red bean paste"], 1], "tw_stinkytofu": ["Stinky tofu", "Stinky tofu is soaked in a fermented brine, then often deep-fried and served with pickled cabbage. Its smell travels far, but fans love the taste.", "What gives stinky tofu its strong smell?", ["Burnt sugar", "A fermented brine", "Fresh mint"], 1], "tw_mangoice": ["Mango shaved ice", "On hot summer days, mountains of fluffy shaved ice are piled high with fresh mango, syrup and sometimes a scoop of mango ice cream.", "What tops a classic mango shaved ice?", ["Hot soup", "Fried rice", "Fresh mango"], 2], "tw_redwhitebag": ["Red & white striped bag", "These cheap, sturdy red-and-white striped bags are everywhere at traditional markets. Many people now see them as a nostalgic symbol of daily life.", "Where do you often see red-and-white striped bags?", ["Traditional markets", "Libraries", "Ski resorts"], 0], "tw_ricecooker": ["Tatung rice cooker", "The Tatung electric cooker first went on sale in 1960. Generations of families use it to cook rice, steam buns and reheat leftovers.", "Besides cooking rice, the Tatung cooker is loved for…", ["Freezing ice", "Grilling steak", "Steaming and reheating"], 2], "tw_slippers": ["Blue & white slippers", "Simple blue-and-white rubber slippers are worn at home, to the shop and around the neighborhood. They’re a cozy everyday icon.", "What colors are the classic slippers?", ["Black and green", "Red and gold", "Blue and white"], 2], "tw_gajibag": ["Gaji bag", "The gaji bag is a woven plastic tote with bold stripes. Long carried to markets, it has become a playful fashion symbol of Taiwan.", "What is a gaji bag known for?", ["Being made of glass", "Fitting in a pocket", "Bright woven stripes"], 2], "tw_scooter": ["Scooter", "Scooters are the easiest way around Taiwan’s busy cities. At rush hour, hundreds wait together at traffic lights before setting off.", "What fills Taiwan’s city streets at rush hour?", ["Camels", "Gondolas", "Scooters"], 2], "tw_bento": ["Railway bento", "Taiwan Railway’s lunch box is a classic: rice topped with a braised pork chop, a marinated egg and pickled vegetables, eaten on the train.", "What is the star of the classic railway bento?", ["A braised pork chop", "Sushi rolls", "A cheese sandwich"], 0], "tw_jiaobei": ["Moon blocks", "Moon blocks are a pair of crescent-shaped blocks thrown to ask the gods a yes-or-no question. One flat side up and one round side up means yes.", "One flat side and one round side facing up means…", ["No", "Ask again tomorrow", "Yes"], 2], "tw_incensebag": ["Temple amulet", "A temple amulet is a small cloth pouch blessed at a temple. People carry it in a bag or hang it in the car for protection and peace.", "Why do people carry a temple amulet?", ["To pay bus fares", "To keep tea warm", "For protection and peace"], 2], "tw_incenseburner": ["Incense burner", "Large incense burners stand in front of temple halls. Visitors pray holding lit incense sticks, then place them in the burner.", "What do visitors place in a temple incense burner?", ["Lit incense sticks", "Fresh flowers", "Coins only"], 0], "tw_stonelion": ["Guardian lions", "Stone lions guard many temple gates in pairs. The male often rests a paw on a ball, while the female watches over a cub.", "What does the female guardian lion often protect?", ["A ball", "A fan", "A cub"], 2], "tw_mazu": ["Mazu, goddess of the sea", "Mazu is the sea goddess who protects sailors and fishermen. Her yearly pilgrimages draw huge crowds walking for days alongside her palanquin.", "Mazu protects people who…", ["Travel by sea", "Bake bread", "Climb mountains"], 0], "tw_fortunestick": ["Fortune poems", "After asking the moon blocks, worshippers shake a cup of numbered sticks until one falls out. Its number matches a short poem with advice.", "What does a numbered fortune stick lead you to?", ["A free meal", "A poem with advice", "A lucky coin"], 1], "tw_taipei101": ["Taipei 101", "Taipei 101 was the world’s tallest building from 2004 to 2010. Inside hangs a giant steel ball that steadies the tower in typhoons and earthquakes.", "What helps steady Taipei 101 in strong winds?", ["Helium balloons", "Anchor chains", "A giant hanging ball"], 2], "tw_alishan": ["Alishan Forest Railway", "The Alishan Forest Railway climbs high into misty mountains. It was first built to carry timber; today visitors ride it to see sunrise over a sea of clouds.", "What was the railway first built to carry?", ["Gold", "Timber", "Tea only"], 1], "tw_sunmoonlake": ["Sun Moon Lake", "Sun Moon Lake is Taiwan’s largest lake. Its name comes from its shape, with one side said to look like the sun and the other like a crescent moon.", "Its name compares the lake’s shape to…", ["A dragon", "The sun and moon", "A teapot"], 1], "tw_taroko": ["Taroko Gorge", "In Taroko Gorge, the Liwu River has carved deep canyons through mountains of marble, leaving towering cliffs and turquoise water.", "Taroko’s soaring cliffs are mostly made of…", ["Sandstone", "Marble", "Chalk"], 1], "tw_blackbear": ["Formosan black bear", "The Formosan black bear lives in Taiwan’s mountain forests. It is easy to recognize by the white V-shaped mark on its chest.", "What marks the Formosan black bear’s chest?", ["Orange spots", "A white V shape", "Blue stripes"], 1], "tw_jiufen": ["Jiufen", "Jiufen is a hillside town of steep stairs, tea houses and red lanterns. It grew during a gold rush in the late 1800s.", "Jiufen grew because of…", ["Gold mining", "The silk trade", "Rice farming"], 0], "tw_skylantern": ["Sky lanterns", "In Pingxi, people write wishes on paper sky lanterns and release them into the night, especially around the Lantern Festival.", "What do people write on sky lanterns?", ["Their wishes", "Home addresses", "Shopping lists"], 0], "tw_dragonboat": ["Dragon boat", "Dragon boat races are held on the fifth day of the fifth lunar month. Teams paddle to the beat of a drum in long boats with dragon heads.", "When is the Dragon Boat Festival?", ["5th day of the 5th lunar month", "New Year’s Eve", "The first day of spring"], 0], "tw_zongzi": ["Zongzi", "Zongzi are parcels of sticky rice and fillings wrapped in bamboo leaves and tied with string. Families eat them at the Dragon Boat Festival.", "What are zongzi wrapped in?", ["Bamboo leaves", "Newspaper", "Seaweed"], 0], "tw_budaixi": ["Glove puppetry", "Budaixi is glove puppetry with richly costumed puppets. A puppeteer’s hand moves inside each one, bringing heroes and battles to life.", "How are budaixi puppets moved?", ["With long strings", "By water jets", "By a hand inside the puppet"], 2], "tw_bbq": ["Mid-Autumn barbecue", "In Taiwan, many families celebrate the Mid-Autumn Festival with an outdoor barbecue under the full moon, along with mooncakes and pomelos.", "Which fruit is a Mid-Autumn favorite in Taiwan?", ["Coconut", "Pomelo", "Cherry"], 1], "tw_spintop": ["Spinning top", "Wooden spinning tops are a traditional game. You wind a cord tightly around the top, then pull and throw to send it whirling.", "How do you launch a wooden top?", ["Kick it", "Blow on it", "Wind a cord and pull"], 2], "tw_teapot": ["Teapot", "Gongfu tea is brewed in a small teapot and poured into tiny cups, many times over. Each short steep brings out a new layer of flavor.", "Gongfu tea is brewed in a teapot that is…", ["Small", "Huge", "Made of paper"], 0], "tw_umbrella": ["Oil-paper umbrella", "In the Hakka town of Meinong, craftspeople make umbrellas with bamboo frames and hand-painted paper, waterproofed with tung oil.", "What makes the paper waterproof?", ["Tung oil", "Sugar syrup", "Wax crayons"], 0], "tw_hakkacloth": ["Hakka floral fabric", "Hakka floral fabric is known for big, bright peonies on red or green backgrounds. It was used for quilts and clothing, and now for bags and design.", "Which flower often blooms on Hakka fabric?", ["Sunflower", "Peony", "Tulip"], 1], "tw_canoe": ["Tao plank canoe", "The Tao people of Orchid Island build canoes by fitting wooden planks together, then paint them with red, black and white patterns, including an eye at each end.", "Which island is home to these canoes?", ["Bali", "Hokkaido", "Orchid Island"], 2], "tw_yingge": ["Yingge pottery", "Yingge, near Taipei, is known as Taiwan’s ceramics town. Its old street is lined with workshops selling teaware, vases and bowls.", "What is Yingge famous for?", ["Fireworks", "Silk", "Pottery"], 2], "tw_oolong": ["High-mountain oolong", "Oolong tea grown high in Taiwan’s misty mountains is rolled into tight little balls. In hot water, the leaves slowly unfurl.", "What happens to rolled oolong leaves in hot water?", ["They turn to sugar", "They melt", "They unfurl"], 2]}, "categories": {"tw_bubbletea": "Food & drink", "tw_xiaolongbao": "Food & drink", "tw_beefnoodle": "Food & drink", "tw_pineapplecake": "Food & drink", "tw_stinkytofu": "Food & drink", "tw_mangoice": "Food & drink", "tw_redwhitebag": "Everyday treasures", "tw_ricecooker": "Everyday treasures", "tw_slipp // ---------- Memory scoring ----------
// Board memory: from the flip log. A "recall chance" is a turn where the first card's partner
// had already been seen; turning that partner is a recall, anything else is a lapse.
// Efficiency compares turns to ~1.61 × pairs, the average a perfect memory needs.
const DAY = 864e5, HOUR = 36e5;
const INTERVALS = [12 * HOUR, DAY, 3 * DAY, 7 * DAY, 14 * DAY, 30 * DAY];
const median = a => { if (!a.length) return null; const b = a.slice().sort((x, y) => x - y), m = b.length >> 1; return b.length % 2 ? b[m] : (b[m - 1] + b[m]) / 2; };
function analyze(g) {
  const n = new Set(g.deck).size, log = g.log || [], stopAt = g.peeked ? (g.peekAt ?? 0) : log.length;
  const lastSeen = {}, dists = [], times = [];
  let opp = 0, hit = 0;
  for (let f = 0; f + 1 < stopAt; f += 2) {
    const a = log[f].i, b = log[f + 1].i, k = g.deck[a];
    const partner = g.deck.findIndex((x, j) => x === k && j !== a);
    if (lastSeen[partner] !== undefined) {
      opp++;
      if (b === partner) { hit++; dists.push(f + 1 - lastSeen[partner]); times.push(log[f + 1].t - log[f].t); }
    }
    lastSeen[a] = f; lastSeen[b] = f + 1;
  }
  const eff = Math.min(1, (1.61 * n) / Math.max(1, g.moves));
  const acc = opp ? hit / opp : null;
  const score = Math.round(100 * (acc === null ? eff : .6 * acc + .4 * eff));
  return { t: Date.now(), c: T.id, s: g.stop, n, moves: g.moves, opp, hit, eff: Math.round(eff * 100) / 100, score, longest: dists.length ? Math.max(...dists) : 0, speed: median(times.filter(x => x < 15000)), peeked: !!g.peeked, partial: !!g.partial };
}
const counted = () => S.mem.filter(m => !m.peeked && !m.partial);
const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;

// Story memory: spaced retrieval (12h → 1d → 3d → 7d → 14d → 30d)
function recordAnswer(k, ok) {
  const now = Date.now(), r = S.rev[k];
  if (!r) { S.rev[k] = { box: ok ? 1 : 0, last: now, due: now + INTERVALS[ok ? 1 : 0], hist: [[now, ok ? 1 : 0, 0]] }; persist(); return; }
  const delay = (now - r.last) / DAY;
  r.hist.push([now, ok ? 1 : 0, Math.round(delay * 10) / 10]); if (r.hist.length > 24) r.hist.splice(1, 1);
  if (delay >= .5) r.box = ok ? Math.min(r.box + 1, INTERVALS.length - 1) : 0;
  r.last = now; r.due = now + INTERVALS[r.box]; persist();
}
const dueReviews = () => Object.entries(S.rev).filter(([k, r]) => items[k] && r && r.due <= Date.now()).sort((a, b) => a[1].due - b[1].due).map(([k]) => k);
function agoText(ms) { const d = ms / DAY; if (d < 1) return `${Math.max(1, Math.round(ms / HOUR))} hours ago`; const n = Math.round(d); return n === 1 ? 'yesterday' : n < 7 ? `${n} days ago` : n < 14 ? 'about a week ago' : `${Math.round(n / 7)} weeks ago`; }

// Memory check: asks a past question without the story, answers reshuffled
function memoryCheck(queue, done, title = 'Memory check') {
  const k = queue[0]; if (!k) { done && done(); return; }
  const [, story, q, answers, correct] = items[k], r = S.rev[k], lang = langOf(k);
  const order = shuffle([0, 1, 2]);

  ov.innerHTML = `<div class="note review" role="dialog" aria-modal="true" aria-labelledby="mc-title">
    <span class="tape" aria-hidden="true"></span>

    <div class="note-head"><div class="note-art tier-art t-${TIERS[tierOf(k)].id}">${paint(k)}</div><div><p class="nat" lang="${lang}" id="mc-title">${LABEL[k][0]}</p><p class="en">${LABEL[k][1]}</p><p class="met">You met this ${agoText(Date.now() - r.last)}</p></div></div>
    <div class="q-row"><p class="q">${q}</p><span class="worth" aria-label="Worth 1 point"><span class="burst" aria-hidden="true"></span><span class="coin"><b>+1</b><small>point</small></span></span></div>
    ${order.map(i => `<button class="answer" data-r="${i}"><span class="mark" aria-hidden="true"></span>${answers[i]}</button>`).join('')}
    <p class="story recap" hidden>${story}</p>
    <div class="note-foot"><p class="feedback" aria-live="polite"></p><button class="btn small" id="skip">Not now</button></div>
  </div>`;
  ov.hidden = false; requestAnimationFrame(() => ov.classList.add('in'));
  const finish = rest => { const o = $('#challenge'); o.classList.remove('in'); setTimeout(() => { o.hidden = true; o.innerHTML = ''; wire(); memoryCheck(rest, done, title); }, 220); };
  $('#skip').onclick = () => finish([]);
  let answered = false;
  $$('[data-r]').forEach(b => b.onclick = () => {
    if (answered) return; answered = true;

}

function memCard(m, prevAvg) {
  if (m.partial) return '';
  const line = m.peeked ? 'You used a peek, so this board isn’t counted in your trends.'
    : prevAvg === null ? 'Your first memory score. It gets more meaningful after a few stops.'
    : m.score >= prevAvg + 5 ? `Above your recent average of ${Math.round(prevAvg)}.`
    : m.score <= prevAvg - 5 ? `A gentler round. Your recent average is ${Math.round(prevAvg)}.`
    : `Right around your recent average of ${Math.round(prevAvg)}.`;
  const acc = m.opp ? m.hit / m.opp : null;
  return `<div class="mem-card">
    <div class="mem-head"><span class="mem-score"><b>${m.score}</b><small>/100</small></span><div><small>Memory score</small><p>${line}</p></div></div>
    <div class="mem-row"><span>Recall</span><span class="mbar"><i style="width:${acc === null ? 0 : acc * 100}%"></i></span><b>${m.opp ? `${m.hit}/${m.opp}` : '–'}</b></div>
    <div class="mem-row"><span>Efficiency</span><span class="mbar"><i style="width:${m.eff * 100}%"></i></span><b>${Math.round(m.eff * 100)}%</b></div>
    ${m.longest ? `<p class="mem-facts">Longest recall: ${m.longest} flips back${m.speed ? ` · Typical recall: ${(m.speed / 1000).toFixed(1)}s` : ''}</p>` : ''}
    <button class="mem-link" id="to-insights">See your memory insights \u203a</button>
  </div>`;
}

function spark(vals) {
  if (vals.length < 2) return '';
  const W = 300, H = 70, step = W / (vals.length - 1);
  const pts = vals.map((v, i) => [i * step, H - 6 - (v / 100) * (H - 12)]);
  return `<svg class="spark" viewBox="-6 0 ${W + 12} ${H}" preserveAspectRatio="none" aria-hidden="true"><g><path d="M0 ${H - 6 - .5 * (H - 12)}H${W}" stroke="#cdbfa6" stroke-dasharray="3 5" fill="none"/><polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="#e2574c" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="3.6" fill="#f2c14e" stroke="#3d372f" stroke-width="1.2"/>`).join('')}</g></svg>`;
}

const MAPPOS = { jp: [300, 120], tw: [200, 250], vn: [96, 330] };

  };
}
$('#market-back').onclick = () => { if (auction) { auction.done = true; auction.timers.forEach(clearTimeout); auction = null; } marketBack ? marketBack() : (renderHome(), show('home')); };

// ---------- Leaderboard ----------
let DB = null, UID = null, board = [], boardState = 'loading', canWrite = true, writing = false, writeAgain = false, boardBack = null;
function cleanRow(d) {
  const v = d.data() || {};
  const score = Number.isFinite(v.score) ? Math.max(0, Math.floor(v.score)) : 0;
  return { id: d.id, name: String(v.name || 'Traveler').slice(0, 18), avatar: v.avatar === 'traveler' || drawings[v.avatar] ? v.avatar : 'daruma', look: cleanLook(v.look), score, stops: Number.isFinite(v.stops) ? Math.max(0, Math.min(THEMES.length * 6, Math.floor(v.stops))) : 0 };
}
const myStops = () => THEMES.reduce((n, t) => n + stopsDone(t), 0);
function myRank(fromBoard = false) {
  if (!UID || boardState !== 'ready') return null;
  const mine = board.find(r => r.id === UID);
  if (fromBoard && !mine) return null;
  const score = fromBoard ? mine.score : S.score;
  const rows = board.filter(r => r.id !== UID).concat([{ id: UID, score }]).sort((a, b) => b.score - a.score);
  return rows.findIndex(r => r.id === UID) + 1;
}
function pushScore() {
  if (!DB || !UID || !canWrite) return;
  const mine = board.find(r => r.id === UID), body = { name: S.name, avatar: S.avatar, look: S.avatar === 'traveler' ? cleanLook(S.look) : null, score: S.score, stops: myStops(), updated: Date.now() };
  if (mine && mine.score === body.score && mine.name === body.name && mine.avatar === body.avatar && JSON.stringify(mine.look || null) === JSON.stringify(body.look) && mine.stops === body.stops) return;
  // optimistic local update so ranks feel instant
  board = board.filter(r => r.id !== UID).concat([{ id: UID, ...body }]).sort((a, b) => b.score - a.score);
  if (writing) { writeAgain = true; return; }
  writing = true;
  DB.doc('scores/' + UID).set(body).catch(e => { if (e && /not_granted|permission|denied|not_writer/i.test(String(e.code || e.message))) canWrite = false; })
    .finally(() => { writing = false; if (writeAgain) { writeAgain = false; pushScore(); } });
}
async function initCloud() {
  const timer = setTimeout(() => { if (boardState === 'loading') { boardState = 'off'; renderBoard(); } }, 10000);
  try {
    if (!window.claude || typeof window.claude.use !== 'function') throw 0;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) throw 0;
    UID = await user.id(); if (!UID) throw 0;
    DB = db;
    if (user.can && user.can('data.write') === false) canWrite = false;
    DB.collection('scores').orderBy('score', 'desc').limit(100).onSnapshot(snap => {
      clearTimeout(timer);
      board = snap.docs.filter(d => d.exists).map(cleanRow);
      const first = boardState !== 'ready'; boardState = 'ready';
      if (first) pushScore();
      renderBoard();
    }, () => { clearTimeout(timer); boardState = 'off'; renderBoard(); });
  } catch { clearTimeout(timer); boardState = 'off'; renderBoard(); }
}
function openBoard(back) {
  boardBack = back || (() => { renderHome(); show('home'); });
  if (!$('#game').hidden) { round++; clearInterval(peekTimer); peekTimer = null; }
  renderBoard(); show('board');
}
function renderBoard() {
  const body = $('#board-body'); if (!body) return;
  if (boardState === 'loading') { body.innerHTML = `<p class="board-msg hand">Gathering the scores…</p>`; return; }
  if (boardState === 'off') {
    body.innerHTML = `<div class="board-msg"><p class="hand">The shared leaderboard isn’t available here.</p><p>It works when this game is opened as a published artifact on claude.ai while signed in. Your own score is still saved: <b>${S.score}</b> points, ${myStops()} of ${THEMES.length * 6} stops.</p></div>`;
    return;
  }
  const rows = board.slice().sort((a, b) => b.score - a.score);
  const r = myRank();
  body.innerHTML = `
    ${!canWrite ? `<p class="board-msg small">You can see the board, but your score can’t be added from this view.</p>` : ''}
    ${r ? `<div class="you-card"><span class="avatar">${avatarArt()}</span><div><small>Your rank</small><b>#${r}</b></div><div class="you-pts">${ICON.star}<b>${S.score}</b></div></div>` : ''}
    ${rows.length ? `<ol class="ranks">${rows.map((p, i) => `<li class="${p.id === UID ? 'me' : ''} ${i < 3 ? 'top' + (i + 1) : ''}">
      <span class="pos">${i < 3 ? `<span class="medal m${i + 1}">${i + 1}</span>` : i + 1}</span>
      <span class="avatar">${avatarArt(p)}</span>
      <span class="who-col"><b>${esc(p.name)}${p.id === UID ? ' <em>(you)</em>' : ''}</b><small>${p.stops} of ${THEMES.length * 6} stops</small></span>
      <span class="pts">${p.score}</span></li>`).join('')}</ol>` : `<p class="board-msg hand">No scores yet. Finish a stop to be the first.</p>`}`;
}
$('#board-back').onclick = () => boardBack ? boardBack() : (renderHome(), show('home'));

// ---------- Profile & journal ----------
let jTheme = 0;
function openProfile() {
  if (!$('#game').hidden) { round++; clearInterval(peekTimer); peekTimer = null; }
  renderProfile(); show('profile');
}
function renderProfile() {

  $('#profile-body').innerHTML = `
    <div class="me">${`<span class="avatar big">${avatarArt()}</span>`}
      <label class="name-field"><span class="sr">Your name</span><input id="name" maxlength="18" value="${esc(S.name)}" autocomplete="off" spellcheck="false"></label></div>
    <button class="dress-btn" id="dress-btn"><span class="dress-fig">${travelerImg(S.look, false)}</span><span><b>Dress up</b><small>${ownedWear().length} of ${WEAR_KEYS.length} costumes from your journeys</small></span><span aria-hidden="true">›</span></button>
    <p class="av-note">${S.unlocked.length + 1} of ${AVATARS.length + 1} avatars · finish stops to unlock more</p>
    <div class="avatars" role="radiogroup" aria-label="Choose your avatar"><button role="radio" aria-checked="${S.avatar === 'traveler'}" aria-label="My traveler" data-av="traveler">${travelerImg(S.look, true)}</button>${AVATARS.map(a => S.unlocked.includes(a)
      ? `<button role="radio" aria-checked="${a === S.avatar}" aria-label="${LABEL[a][1]}" data-av="${a}">${paint(a, 'flat')}</button>`
      : `<span class="av-locked" aria-label="Locked avatar">${ICON.lock}</span>`).join('')}</div>
    <div class="stats">
      <div><b class="score-val">${S.score}</b><small>points</small></div>
      <div><b>${myStops()}</b><small>of ${THEMES.length * 6} stops</small></div>
      <div><b>${journal.length}</b><small>of ${THEMES.length * 36} found</small></div>
    </div>
    <button class="ins-entry" id="open-insights"><span class="ins-ico" aria-hidden="true">✦</span><span><b>Memory insights</b><small>${counted().length ? `Recent memory score ${Math.round(avg(counted().slice(-5).map(m => m.score)))}` : 'See how your memory plays out'}${dueReviews().length ? ` · ${dueReviews().length} memory check${dueReviews().length > 1 ? 's' : ''} due` : ''}</small></span><span aria-hidden="true">›</span></button>
    <h2 class="j-title">My journal</h2>
    <div class="seg" role="group" aria-label="Destination">${THEMES.map((t, i) => `<button aria-pressed="${i === jTheme}" data-j="${i}">${t.country}</button>`).join('')}</div>
    ${tierSummary(THEMES[jTheme].order)}
    <ul class="poster-list journal">${byTier(THEMES[jTheme].order).map(k => journal.includes(k)
      ? plItem(k, THEMES[jTheme].lang, true)
      : `<li class="empty" aria-label="${TIERS[tierOf(k)].name} item, not found yet"><span class="pl-art t-${TIERS[tierOf(k)].id}">?</span><span class="pl-text"><small>Not found yet</small>${tierTag(k)}</span></li>`).join('')}</ul>`;
  $('#name').onchange = e => { S.name = e.target.value.trim().slice(0, 18) || 'Traveler'; persist(); pushScore(); };
  $$('[data-av]').forEach(b => b.onclick = () => { S.avatar = b.dataset.av; persist(); pushScore(); renderProfile(); });
  $$('[data-j]').forEach(b => b.onclick = () => { jTheme = +b.dataset.j; renderProfile(); });
  $('#open-insights').onclick = () => openInsights();
  $('#dress-btn').onclick = () => openWardrobe();
  if (ownedWear().length) setTimeout(() => { if (!$('#profile').hidden) coach('dress', '#dress-btn', 'Try on your costumes'); }, 540);
  $$('[data-k]').forEach(b => b.onclick = () => {
    const k = b.dataset.k;
    sheet(`<div class="sheet-art">${paint(k)}</div><p class="nat" lang="${langOf(k)}">${LABEL[k][0]}</p><p class="en">${LABEL[k][1]} · ${categories[k]}</p><p>${tierTag(k)}</p><p>${items[k][1]}</p><button class="btn primary" data-close>Close</button>`);
  });
  wire();
}
$('#profile-back').onclick = () => { renderHome(); show('home'); };

// ---------- Bottom sheet ----------
let onClose = null;
function sheet(html, after = null) { onClose = after; $('#sheet-body').innerHTML = html; $('#sheet').showModal(); $('#sheet-body').scrollTop = 0; $('#sheet-body').focus({ preventScroll: true }); $$('#sheet [data-close]').forEach(b => b.onclick = closeSheet); }
function closeSheet() { const s = $('#sheet'); if (!s.open) return; s.classList.add('leaving'); setTimeout(() => { s.classList.remove('leaving'); s.close(); }, 200); }
$('#sheet').addEventListener('close', () => { const f = onClose; onClose = null; if (f) f(); });
$('#sheet').addEventListener('click', e => { if (e.target.id === 'sheet') closeSheet(); });
$('#sheet').addEventListener('cancel', e => { e.preventDefault(); closeSheet(); });
// ---------- Motion tutorial: arrows pointing at the next thing to do ----------
if (!S.tips || typeof S.tips !== 'object') S.tips = {};
let coachOn = null; const coachQ = [];
function coach(id, sel, text, o = {}) {
  if (S.tips[id]) return;
  if (coachOn) { if (coachOn !== id && !coachQ.some(q => q[0] === id)) coachQ.push([id, sel, text, o]); return; }
  const el = typeof sel === 'string' ? $(sel) : sel;
  if (!el || !el.getClientRects().length) return;
  const r = el.getBoundingClientRect(), vw = innerWidth, vh = innerHeight;
  if (r.bottom < 0 || r.top > vh) return;
  coachOn = id; S.tips[id] = 1; persist();
  const pad = o.pad ?? 8, above = o.place ? o.place === 'above' : r.top > vh * .42;
  const cx = r.left + r.width / 2;
  const lx = Math.min(vw - 110, Math.max(110, cx + (o.shift || 0)));
  const ly = above ? Math.max(70, r.top - pad - 120) : Math.min(vh - 70, r.bottom + pad + 110);
  const sx = lx + (cx > lx ? 30 : cx < lx ? -30 : 0), sy = above ? ly + 26 : ly - 26;
  const ex = cx, ey = above ? r.top - pad - 8 : r.bottom + pad + 8;
  const bend = (ex - sx) === 0 ? 40 : -(ex - sx) * .5;
  const qx = (sx + ex) / 2 + bend, qy = (sy + ey) / 2;
  const ang = Math.atan2(ey - qy, ex - qx), h = 13;
  const head = `M${ex - h * Math.cos(ang - .5)} ${ey - h * Math.sin(ang - .5)}L${ex} ${ey}L${ex - h * Math.cos(ang + .5)} ${ey - h * Math.sin(ang + .5)}`;
  const tap = o.tap === false ? '' : `<span class="ripple" style="left:${cx}px;top:${r.top + r.height / 2}px"></span><span class="ripple b" style="left:${cx}px;top:${r.top + r.height / 2}px"></span>`;
  const box = $('#coach');
  box.innerHTML = `<div class="spot" style="left:${r.left - pad}px;top:${r.top - pad}px;width:${r.width + pad * 2}px;height:${r.height + pad * 2}px"></div>${tap}
    <svg class="arrow" aria-hidden="true" style="--dx:${Math.cos(ang) * 6}px;--dy:${Math.sin(ang) * 6}px"><g><path d="M${sx} ${sy}Q${qx} ${qy} ${ex} ${ey}"/><path d="${head}"/></g></svg>
    <div class="tip" role="status" style="left:${lx}px;top:${ly - 22}px">${text}</div>`;
  box.querySelectorAll('.arrow path').forEach(pth => { const L = Math.ceil(pth.getTotalLength()); pth.style.setProperty('--len', L); });
  box.hidden = false;
  const close = () => {
    if (coachOn !== id) return;
    document.removeEventListener('pointerdown', close, true); removeEventListener('resize', close);
    box.classList.add('out');
    setTimeout(() => { box.classList.remove('out'); box.hidden = true; box.innerHTML = ''; coachOn = null; const n = coachQ.shift(); if (n) setTimeout(() => coach(...n), 300); }, 220);
  };
  setTimeout(() => { document.addEventListener('pointerdown', close, true); addEventListener('resize', close); }, 360);
}
const tipBoard = () => setTimeout(() => { if (!$('#game').hidden && !locked) coach('flip', $('#grid .card:not(:disabled)'), 'Tap 2 cards · find a pair'); }, 200);
function help() {
  // the "?" button replays the arrows instead of showing a wall of text
  S.tips = {}; persist(); coachQ.length = 0;
  if (!$('#home').hidden) renderHome();
  else if (!$('#map').hidden) openMap(THEMES.indexOf(T));
  else if (!$('#game').hidden) tipBoard();
}

// ---------- Board sizing ----------
// Pick the grid that makes the cards as big as possible for this screen:
// e.g. 12 cards → 3×4 on a tall phone, 4×3 on a wide one. Cards may stretch between 1.05 and 1.55 tall.
function fitBoard() {
  const w = $('#board-wrap'), grid = $('#grid'); if (!w || $('#game').hidden || !G) return;
  const N = G.deck.length, W = w.clientWidth, H = w.clientHeight, g = Math.max(8, Math.min(14, Math.min(W, H) * .028));
  let best = null;
  for (let c = 2; c <= 6; c++) {
    if (N % c) continue;
    const r = N / c;
    let cw = Math.min((W - (c - 1) * g) / c, 170), ch = Math.min(cw * 1.55, (H - (r - 1) * g) / r);
    if (ch < cw * 1.05) cw = ch / 1.05;
    if (cw <= 0) continue;
    const area = cw * ch;
    if (!best || area > best.area) best = { c, r, cw: Math.floor(cw), ch: Math.floor(ch), area };
  }
  if (!best) return;
  grid.style.gridTemplateColumns = `repeat(${best.c}, ${best.cw}px)`;
  grid.style.gridAutoRows = `${best.ch}px`;
  grid.style.setProperty('--cw', best.cw + 'px'); grid.style.setProperty('--gap', g + 'px');
  grid.classList.toggle('tiny', best.cw < 70);
}
addEventListener('resize', fitBoard);

// ---------- Boot ----------
THEMES.forEach(t => { if (new Set(t.order).size !== 36 || t.order.some(k => !items[k] || !LABEL[k])) console.warn('Theme data mismatch', t.country); });
$$('[data-icon]').forEach(e => e.innerHTML = ICON[e.dataset.icon]);
renderHome(); show('home');
initCloud();
S.seenHelp = true;

</script>
